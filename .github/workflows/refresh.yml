name: refresh-vendor-snapshot

# 每周检查 7 个厂商技能仓库是否有上游更新；有则重建快照、重建站点、提交并部署。
on:
  schedule:
    - cron: "23 3 * * 1" # 每周一 03:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "跳过变更检测，强制重建"
        type: boolean
        default: false

permissions:
  contents: write

env:
  REPOS: "higgsfield-skills runwayml-skills runway-mcp-plugin atlascloud-skills fal-community-skills elevenlabs-plugin anthropics-skills"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 数据新鲜度检查（>30 天未更新标黄，不阻塞）
        if: always()
        run: |
          python3 - << 'EOF'
          import json, os, datetime as dt, pathlib
          today = dt.date.today()
          lines = ["### data/ 新鲜度", ""]
          stale = 0
          for f in sorted(pathlib.Path("data").glob("*.json")):
              if f.name.startswith("_"):
                  continue
              try:
                  as_of = json.loads(f.read_text()).get("as_of")
              except Exception as e:
                  lines.append(f"- ⚠️ `{f}` 解析失败：{e}"); stale += 1; continue
              if not as_of:
                  lines.append(f"- 🟡 `{f}` 尚无 as_of（数据未实采）"); stale += 1; continue
              age = (today - dt.date.fromisoformat(as_of)).days
              mark = "🟢" if age <= 30 else "🟡"
              if age > 30: stale += 1
              lines.append(f"- {mark} `{f}` as_of {as_of}（{age} 天前）")
          lines.insert(1, "---")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("\n".join(lines) + "\n")
          EOF

      - uses: astral-sh/setup-uv@v5

      - name: 按 pinned SHA 克隆厂商仓库
        run: ./setup.sh

      - name: 检测上游更新
        id: upstream
        run: |
          changed=""
          for d in $REPOS; do
            pinned=$(git -C "$d" rev-parse HEAD)
            remote=$(git -C "$d" ls-remote origin HEAD | cut -f1)
            if [ -n "$remote" ] && [ "$pinned" != "$remote" ]; then
              changed="$changed $d"
              echo "↑ $d: $pinned -> $remote"
            fi
          done
          echo "changed=${changed# }" >> "$GITHUB_OUTPUT"

      - name: 更新 setup.sh 到新 SHA 并检出
        if: steps.upstream.outputs.changed != '' || inputs.force == true
        run: |
          for d in ${{ steps.upstream.outputs.changed }}; do
            newsha=$(git -C "$d" ls-remote origin HEAD | cut -f1)
            sed -i "s|\(clone https://[^ ]*/[^ ]*\.git *$d *\)[0-9a-f]\{7,\}|\1$newsha|" setup.sh
            git -C "$d" fetch origin >/dev/null 2>&1
            git -C "$d" checkout --detach "$newsha"
            echo "✓ $d -> $newsha"
          done

      - name: 重建站点
        if: steps.upstream.outputs.changed != '' || inputs.force == true
        run: |
          uv run --with markdown python build_skills_site.py
          uv run --with markdown python gen_appendix.py
          cp index.html site/index.html
          npx -y pagefind --site site

      - name: 提交快照更新
        if: steps.upstream.outputs.changed != '' || inputs.force == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh vendor snapshot (${REPOS})"
          git push

      - name: 部署到 Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && (steps.upstream.outputs.changed != '' || inputs.force == true)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=video-vendor-skills --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
